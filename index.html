<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>چت</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600&display=swap">
<style>
:root{--bg:#e9eff3;--ink:#14263a;--mine:#1f6f6b;--theirs:#fff;--line:#c9d5de;--muted:#6b7f90;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a24;--ink:#e6eef5;--mine:#2a8a85;--theirs:#1b2b3a;--line:#2a3d4f;--muted:#8aa0b2}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;font-size:16px}
.screen{display:none;height:100%;max-width:640px;margin:0 auto;flex-direction:column}
.screen.on{display:flex}
.card{margin:auto 16px;background:var(--theirs);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:12px}
h1{font-size:20px;margin:0 0 4px}
p.hint{margin:0;color:var(--muted);font-size:14px;line-height:1.7}
input{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
input:focus-visible,button:focus-visible{outline:2px solid var(--mine);outline-offset:2px}
button{font:inherit;border:0;border-radius:10px;padding:11px 14px;background:var(--mine);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--mine);border:1px solid var(--line)}
.row{display:flex;gap:8px}.row>*{flex:1}
.err{color:var(--err);font-size:14px;min-height:20px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;border-bottom:1px solid var(--line)}
header b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
header button{padding:6px 10px;font-size:14px}
.add{display:flex;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.add input{flex:1}.add button{width:auto}
#list{flex:1;overflow-y:auto}
.item{display:block;width:100%;text-align:start;background:transparent;color:var(--ink);border:0;border-bottom:1px solid var(--line);border-radius:0;padding:12px 16px}
.item b{display:block;font-weight:600;direction:ltr;text-align:right}
.item span{display:block;color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#msgs{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:6px}
.m{max-width:80%;padding:8px 12px;border-radius:14px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.m.me{align-self:flex-start;background:var(--mine);color:#fff;border-end-start-radius:4px}
.m.them{align-self:flex-end;background:var(--theirs);border:1px solid var(--line);border-end-end-radius:4px}
.m small{display:block;font-size:11px;opacity:.7;margin-top:2px}
.empty{margin:auto;color:var(--muted);text-align:center;font-size:14px;padding:24px}
form{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
form input{flex:1}form button{width:auto}
</style>
</head>
<body>

<section id="auth" class="screen on">
  <div class="card">
    <h1>ورود به چت</h1>
    <p class="hint">با ایمیل و رمز عبور وارد شوید یا حساب بسازید.</p>
    <input id="email" type="email" dir="ltr" placeholder="ایمیل" autocomplete="email">
    <input id="pass" type="password" dir="ltr" placeholder="رمز عبور (حداقل ۶ کاراکتر)" autocomplete="current-password">
    <div class="row"><button id="login">ورود</button><button id="signup" class="ghost">ساخت حساب</button></div>
    <div id="err" class="err" role="alert"></div>
  </div>
</section>

<section id="home" class="screen">
  <header><b id="me"></b><button id="out" class="ghost">خروج</button></header>
  <div class="add">
    <input id="partner" type="email" dir="ltr" placeholder="ایمیل کاربر برای گفتگوی جدید">
    <button id="start">شروع</button>
  </div>
  <div id="err2" class="err" role="alert" style="padding:0 16px"></div>
  <div id="list"></div>
</section>

<section id="chat" class="screen">
  <header><button id="back" class="ghost">برگشت</button><b id="who" dir="ltr"></b></header>
  <div id="msgs"></div>
  <form id="f"><input id="txt" placeholder="پیام بنویسید" autocomplete="off"><button type="submit">ارسال</button></form>
</section>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ===== تنظیمات Firebase پروژه‌ی خودتان را اینجا بگذارید =====
const firebaseConfig = {
  apiKey: "AIzaSyBKCWauhqBQul3pd_kJSQP9XhKRWLdhA6U",
  authDomain: "mizban-10a1e.firebaseapp.com",
  projectId: "mizban-10a1e",
  appId: "1:588862324148:web:ead415c7494ec4cb6d86e1"
};
// =========================================================

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth(), db = firebase.firestore(), TS = firebase.firestore.FieldValue.serverTimestamp;
const $ = id => document.getElementById(id);
let me = null, listUnsub = null, msgUnsub = null, cur = null;

const show = id => document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));
const faErr = c => ({
  'auth/invalid-email':'ایمیل معتبر نیست.',
  'auth/missing-password':'رمز عبور را وارد کنید.',
  'auth/weak-password':'رمز عبور باید حداقل ۶ کاراکتر باشد.',
  'auth/email-already-in-use':'این ایمیل قبلاً ثبت شده است. وارد شوید.',
  'auth/invalid-credential':'ایمیل یا رمز عبور اشتباه است.',
  'auth/network-request-failed':'اتصال اینترنت برقرار نیست.'
}[c] || 'خطایی رخ داد. دوباره تلاش کنید.');
const fmt = t => t ? t.toDate().toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'}) : '...';

$('login').onclick = async () => {
  $('err').textContent = '';
  try { await auth.signInWithEmailAndPassword($('email').value.trim(), $('pass').value); }
  catch(e){ $('err').textContent = faErr(e.code); }
};
$('signup').onclick = async () => {
  $('err').textContent = '';
  try { await auth.createUserWithEmailAndPassword($('email').value.trim(), $('pass').value); }
  catch(e){ $('err').textContent = faErr(e.code); }
};
$('out').onclick = () => auth.signOut();

auth.onAuthStateChanged(u => {
  me = u;
  if (listUnsub) listUnsub(); if (msgUnsub) msgUnsub();
  if (!u) { show('auth'); return; }
  db.collection('users').doc(u.uid).set({email:u.email.toLowerCase()}, {merge:true});
  $('me').textContent = u.email;
  show('home');
  listUnsub = db.collection('chats').where('members','array-contains',u.uid).onSnapshot(snap => {
    const box = $('list'); box.innerHTML = '';
    const docs = snap.docs.filter(d => d.data().last !== undefined)
      .sort((a,b) => (b.data().lastT?.seconds||0) - (a.data().lastT?.seconds||0));
    if (!docs.length) { box.innerHTML = '<div class="empty">هنوز گفتگویی ندارید. ایمیل یک نفر را بالا وارد کنید.</div>'; return; }
    docs.forEach(d => {
      const c = d.data(), pid = c.members.find(x => x !== u.uid);
      const b = document.createElement('button'); b.className = 'item';
      b.innerHTML = '<b></b><span></span>';
      b.firstChild.textContent = c.emails[pid] || '';
      b.lastChild.textContent = (c.lastFrom === u.uid ? 'شما: ' : '') + c.last;
      b.onclick = () => openChat({uid:pid, email:c.emails[pid]});
      box.appendChild(b);
    });
  });
});

$('start').onclick = async () => {
  $('err2').textContent = '';
  const mail = $('partner').value.trim().toLowerCase();
  if (!mail || mail === me.email.toLowerCase()) { $('err2').textContent = 'ایمیل طرف مقابل را درست وارد کنید.'; return; }
  try {
    const q = await db.collection('users').where('email','==',mail).limit(1).get();
    if (q.empty) { $('err2').textContent = 'کاربری با این ایمیل پیدا نشد. از او بخواهید اول حساب بسازد.'; return; }
    $('partner').value = '';
    openChat({uid:q.docs[0].id, email:mail});
  } catch(e){ $('err2').textContent = faErr(e.code); }
};

$('back').onclick = () => { if (msgUnsub) msgUnsub(); cur = null; show('home'); };

function openChat(p){
  const chatId = [me.uid, p.uid].sort().join('_');
  cur = {id:chatId, p};
  $('who').textContent = p.email;
  show('chat');
  const box = $('msgs');
  if (msgUnsub) msgUnsub();
  msgUnsub = db.collection('chats').doc(chatId).collection('messages').orderBy('t').limit(200).onSnapshot(snap => {
    box.innerHTML = '';
    if (snap.empty) { box.innerHTML = '<div class="empty">هنوز پیامی نیست. اولین پیام را بفرستید.</div>'; return; }
    snap.forEach(d => {
      const m = d.data(), el = document.createElement('div');
      el.className = 'm ' + (m.from === me.uid ? 'me' : 'them');
      el.textContent = m.text;
      const s = document.createElement('small'); s.textContent = fmt(m.t);
      el.appendChild(s); box.appendChild(el);
    });
    box.scrollTop = box.scrollHeight;
  }, () => { box.innerHTML = '<div class="empty">دسترسی به این گفتگو ممکن نیست.</div>'; });
}

$('f').onsubmit = async e => {
  e.preventDefault();
  const text = $('txt').value.trim();
  if (!text || !cur) return;
  $('txt').value = '';
  const ref = db.collection('chats').doc(cur.id), b = db.batch();
  b.set(ref, {
    members:[me.uid, cur.p.uid],
    emails:{[me.uid]:me.email.toLowerCase(), [cur.p.uid]:cur.p.email},
    last:text.slice(0,80), lastFrom:me.uid, lastT:TS()
  }, {merge:true});
  b.set(ref.collection('messages').doc(), {text, from:me.uid, t:TS()});
  try { await b.commit(); } catch(err){ $('txt').value = text; }
};
</script>
</body>
</html>
